<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10243f">
    <meta name="description" content="Sign in or create an account for the Online Auction Simulator.">
    <title>Sign in · Online Auction Simulator</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body data-page="login" class="auth-page">
    <header class="site-header auth-header">
        <div class="header-inner">
            <a class="brand" href="login.html" aria-label="Online Auction Simulator sign in">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="m14.2 4.3 5.5 5.5M10.7 7.8l5.5 5.5M8.3 10.2l5.5 5.5M4.8 13.7l5.5 5.5M3 21h18M12.5 3l8.5 8.5-3.2 3.2L9.3 6.2 12.5 3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
                <span class="brand-name">Online Auction Simulator</span>
            </a>
            <span id="api-status" class="api-status" role="status" aria-live="polite">
                <span class="status-dot" aria-hidden="true"></span>
                Checking API…
            </span>
        </div>
    </header>

    <main class="auth-main">
        <section class="auth-card" aria-labelledby="auth-heading">
            <div class="auth-card-heading">
                <span class="eyebrow">Welcome to the marketplace</span>
                <h1 id="auth-heading">Sign in to continue</h1>
                <p>Access your account to bid, manage auctions, and follow your activity.</p>
            </div>
            <div id="auth-options" class="auth-switch">
                <span>New to the marketplace?</span>
                <button id="show-register-button" class="text-button" type="button">Create an account</button>
            </div>
            <form id="login-form" class="login-form auth-form">
                <label>
                    <span>Email</span>
                    <input id="login-email" name="email" type="email" autocomplete="username" required>
                </label>
                <label>
                    <span>Password</span>
                    <input id="login-password" name="password" type="password" autocomplete="current-password" required>
                </label>
                <button id="login-button" class="submit-button" type="submit">Log in</button>
            </form>
            <form id="registration-form" class="account-form auth-form" hidden>
                <label>
                    <span>User ID</span>
                    <input id="registration-user-id" name="userId" type="number" min="1" step="1" required>
                </label>
                <label>
                    <span>Name</span>
                    <input id="registration-name" name="name" type="text" autocomplete="name" required>
                </label>
                <label>
                    <span>Email</span>
                    <input id="registration-email" name="email" type="email" autocomplete="email" required>
                </label>
                <label>
                    <span>Password</span>
                    <input id="registration-password" name="password" type="password" autocomplete="new-password" required>
                </label>
                <label>
                    <span>Role</span>
                    <select id="registration-role" name="role" required>
                        <option value="BUYER">Buyer</option>
                        <option value="SELLER">Seller</option>
                    </select>
                </label>
                <div class="account-form-actions">
                    <button id="register-button" class="submit-button" type="submit">Register</button>
                    <button id="show-login-button" class="text-button" type="button">Back to login</button>
                </div>
            </form>
            <div id="registration-message" class="account-message" role="status" aria-live="polite" hidden></div>
            <div id="login-message" class="account-message" role="status" aria-live="polite" hidden></div>
            <p class="auth-footnote">Buyer and Seller accounts are supported.</p>
        </section>
        <a class="auth-back-link" href="index.html">Return to auction dashboard</a>
    </main>
</body>
</html>
